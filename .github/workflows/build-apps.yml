# Builds the Windows (.exe), Mac (.dmg) and Android (.apk) apps and puts them on the Releases page.
# Runs by itself whenever index.html changes, or by hand from the Actions tab (Build apps → Run workflow).
name: Build apps
on:
  push:
    branches: [main]
    paths: [index.html, desktop/**, android-app/**, .github/workflows/build-apps.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: build-apps, cancel-in-progress: true }

jobs:
  version:
    runs-on: ubuntu-latest
    outputs: { v: "${{ steps.v.outputs.v }}" }
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "v=$(grep -o 'APP_VERSION = "[^"]*"' index.html | head -1 | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

  desktop:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, cmd: dist:win, out: "desktop/dist/Label-Print-Setup.exe" }
          - { os: macos-latest, cmd: dist:mac, out: "desktop/dist/Label-Print.dmg" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Copy the web app into the desktop app
        shell: bash
        run: |
          mkdir -p desktop/app
          cp index.html sw.js manifest.webmanifest icon-192.png icon-512.png desktop/app/
          [ -d fonts ] && cp -r fonts desktop/app/ || true
          cp icon-512.png desktop/icon.png
      - name: Build
        shell: bash
        env: { CSC_IDENTITY_AUTO_DISCOVERY: "false" }
        run: |
          cd desktop
          npm install --no-audit --no-fund
          npm pkg set version="1.0.${{ github.run_number }}"
          npm run ${{ matrix.cmd }}
      - uses: actions/upload-artifact@v4
        with: { name: "app-${{ matrix.os }}", path: "${{ matrix.out }}" }

  android:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Build the Android app
        run: |
          sudo apt-get install -y imagemagick >/dev/null || true
          cd android-app
          mkdir -p www && cp ../index.html ../sw.js ../manifest.webmanifest ../icon-192.png ../icon-512.png www/
          [ -d ../fonts ] && cp -r ../fonts www/ || true
          npm install --no-audit --no-fund
          npx cap add android
          # app icon from icon-512.png
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do n=${d%%:*}; s=${d##*:}; f=android/app/src/main/res/mipmap-$n;
            mkdir -p $f; convert ../icon-512.png -resize ${s}x${s} $f/ic_launcher.png; cp $f/ic_launcher.png $f/ic_launcher_round.png;
            convert ../icon-512.png -resize ${s}x${s} $f/ic_launcher_foreground.png; done
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../Label-Print.apk
      - uses: actions/upload-artifact@v4
        with: { name: app-android, path: Label-Print.apk }

  release:
    needs: [version, desktop, android]
    if: ${{ always() && needs.version.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.v }}
          name: Label Print ${{ needs.version.outputs.v }}
          make_latest: "true"
          fail_on_unmatched_files: false
          body: |
            Windows: Label-Print-Setup.exe · Mac: Label-Print.dmg · Android: Label-Print.apk
            Or use the web app: https://bhargavramya.github.io/lable-printer/
          files: |
            out/Label-Print-Setup.exe
            out/Label-Print.dmg
            out/Label-Print.apk
